# CoLT-mode baseline: coalesced-large-reach TLB per Pham et al. - on a
# miss the walker's PTE cache line (8 PTEs) is inspected for FREE
# (already fetched), and a coalesced entry up to 32KB (15 bits) is
# installed. This is the stronger hardware-only baseline vs bounded-k4:
# same base system as vtsa_hwk.cfg; TLB lists gain the 15-bit size.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_vtsa.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

# ---- Scheme-specific overrides ----
[perf_model/mmu/vtsa]
mode = "hardware_k"
colt_mode = true

[perf_model/mmu/tlb_level_1/tlb2]
page_size = 5
page_size_list = 14,15,16,18,21

[perf_model/mmu/tlb_level_2/tlb1]
page_size = 6
page_size_list = 12,14,15,16,18,21

[perf_model/reserve_thp]
target_fragmentation = 1.0
threshold_for_promotion = 1.1
