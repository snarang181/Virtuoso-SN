# THP reference for the V-TSA grid: instant promotion (the scan_lag=0
# parity regime), VTSA layer off, IDENTICAL TLB hierarchy to the vtsa_*
# schemes so rows differ only in policy.

#include ./common_configs/base_system_sniperspace.cfg
#include ./core_configs/meteor_lake_pcore.cfg
#include ./mmu_configs/mmu_vtsa.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./dram_configs/ddr4_2400_4channel.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

# ---- Scheme-specific overrides ----
[perf_model/mmu/vtsa]
mode = "off"

[perf_model/reserve_thp]
target_fragmentation = 1.0
threshold_for_promotion = 0.0
