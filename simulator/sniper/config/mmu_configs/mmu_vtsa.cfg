# V-TSA MMU configuration: verified certified-region TLB coalescing.
#
# Structure mirrors mmu_base.cfg (Meteor-Lake-style two-level TLB subsystem,
# 4 walkers), with two V-TSA changes:
#   1. type="vtsa" selects MemoryManagementUnitVTSA (mmu_designs/mmu_vtsa.cc)
#   2. the data-side TLBs support the coalesced granularity set
#      {4KB, 16KB, 64KB, 256KB, 2MB} = page-size bits {12, 14, 16, 18, 21}
#
# [perf_model/mmu/vtsa] keys (charged-constants defaults follow
# simulator/tlb_sim.py of the v-tsa repo):
#   mode            - "auto_certify" (blind 64-miss heuristic; Phase 4 adds
#                     hint-gated modes) | "hardware_k" (bounded baseline) |
#                     "off"
#   k_budget        - extra-PTE probe budget for hardware_k (default 4)
#   miss_threshold  - misses per 2MB window before auto-certify (default 64)
#   rlb_entries     - certificate-RLB capacity (default 16)
#   cert_check_cycles / rlb_miss_cycles / pte_probe_cycles - 2 / 20 / 4

[perf_model/mmu]
type="vtsa"
page_table_walkers=4
metadata_table_name="none"
count_page_fault_latency = "false"
correct_prediction_latency=4
misprediction_latency=10
page_size_prediction_enabled=false
ptw_access_logging = false
ptw_access_logging_sample_rate = 100

[perf_model/mmu/vtsa]
mode = "auto_certify"
k_budget = 4
miss_threshold = 64
rlb_entries = 16
cert_check_cycles = 2
rlb_miss_cycles = 20
pte_probe_cycles = 4
metadata_lookup_cycles = 4
region_check_cycles = 1

[perf_model/mmu/tlb_subsystem/page_size_predictor]
type = "default"

[perf_model/mmu/tlb_subsystem]
number_of_levels = 2
prefetch_enabled = false

[perf_model/mmu/pwc]
enabled=true
levels=3
entries=32,32,32
associativity=4,4,4
access_penalty=1
miss_penalty=1

[perf_model/mmu/tlb_level_1]
number_of_tlbs = 3

[perf_model/mmu/tlb_level_1/tlb1]
type = "Data"
size = 64
assoc = 4
page_size = 1
page_size_list = 12
allocate_on_miss = "true"
access_latency = 1

# Coalesced/huge data TLB: 16KB/64KB/256KB/2MB entries
[perf_model/mmu/tlb_level_1/tlb2]
type = "Data"
size = 64
assoc = 4
page_size = 4
page_size_list = 14,16,18,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_1/tlb3]
type = "Instruction"
size = 64
assoc = 4
page_size = 2
page_size_list = 12,21
allocate_on_miss = "true"
access_latency = 1

[perf_model/mmu/tlb_level_2]
number_of_tlbs = 1

[perf_model/mmu/tlb_level_2/tlb1]
type = "Unified"
size = 2048
assoc = 8
page_size=5
page_size_list = 12,14,16,18,21
allocate_on_miss = "false"
access_latency = 12
replacement_policy = "lru"

[perf_model/mmu/tlb_level_2/tlb1/chirp]
table_size = 1024
threshold = 2

[perf_model/superpage]
small_page_size = 12
large_page_size = 21
table_size = 2

[perf_model/mmu/tlb_prefetch]
number_of_pqs = 1

[perf_model/tlb_prefetch/pq1]
type = "Data"
size = 1024
access_latency=1
number_of_prefetchers=1
prefetcher_list="asp"

[perf_model/tlb_prefetch/pq1/stride_prefetcher]
length=2

[perf_model/tlb_prefetch/pq1/asp_prefetcher]
table_size=16
prefetch_threshold=0
extra_prefetch="true"
lookahead=4
degree=3
